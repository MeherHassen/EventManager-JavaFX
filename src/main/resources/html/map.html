<!DOCTYPE html>
<html>
  <head>
    <title>OpenStreetMap</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
      #map {
        height: 400px;
        width: 100%;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      var map = L.map("map").setView([36.8065, 10.1815], 13);
      var marker = null;

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      function updateMarker(lat, lng) {
        console.log("Updating marker to:", lat, lng);
        if (marker) {
          map.removeLayer(marker);
        }
        marker = L.marker([lat, lng]).addTo(map);
        map.setView([lat, lng], map.getZoom());
      }

      map.on("click", function (e) {
        console.log("Map clicked at:", e.latlng.lat, e.latlng.lng);
        var lat = e.latlng.lat;
        var lng = e.latlng.lng;
        updateMarker(lat, lng);
        if (window.javaController) {
          console.log("Calling Java controller with coordinates:", lat, lng);
          window.javaController.handleMapClick(lat, lng);
        } else {
          console.error("Java controller not found");
        }
      });

      // Initialize with default marker
      updateMarker(36.8065, 10.1815);
    </script>
  </body>
</html>
